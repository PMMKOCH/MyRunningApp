      <label class="form-label">Trainingsumgebung</label>
      <select class="form-select" id="pe-env">
        ${envOpts.map(([v,l]) => `<option value="${v}" ${(p.environment||'mix')===v?'selected':''}>${l}</option>`).join('')}
      </select>
      <div class="pe-help">Wirkt bei KI-Verlängerungen: Outdoor unterdrückt Kinomap, Indoor bekommt für jeden langen Lauf eine Stadtstrecke, Mix nur am langen Lauf.</div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Laufband-Steigung (%)</label>
        <input type="text" inputmode="decimal" pattern="[0-9.,]*" min="0" max="15" step="0.5" class="form-input" id="pe-incline" value="${p.incline ?? 1}">
        <div class="pe-help">Wird in jedem Pace-Chip im Tracker angezeigt (↗ X %). Standard 1 % gleicht fehlenden Luftwiderstand vs. Outdoor aus. Höher (z.B. 1,5 %) = realistischere Outdoor-Übertragung.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Sprint-Tempo (km/h)</label>
        <input type="text" inputmode="decimal" pattern="[0-9.,]*" min="8" max="22" step="0.1" class="form-input" id="pe-sprintpace" value="${p.sprintPace || ''}" placeholder="auto">
        <div class="pe-help">Sprint-Tempo skaliert NICHT linear mit Easy. Hier kannst du dein realistisches Sprint-Maximum eingeben — wirkt bei NEUEN Sessions (Hill-Training, KI-Verlängerung). Leer = wird aus Easy abgeleitet (~+2,2).</div>
      </div>
    </div>

    <div class="form-group">
      <label class="wd-pill" style="display:flex;align-items:center;justify-content:flex-start;gap:10px;text-align:left;padding:10px 14px;width:100%;color:var(--text)">
        <input type="checkbox" id="pe-hill" ${p.hillTraining?'checked':''} style="opacity:1;position:static;pointer-events:auto;width:16px;height:16px;accent-color:var(--accent)">
        <span style="font-weight:500">Hill-Training einbauen</span>
      </label>
      <div class="pe-help">Wenn aktiv, baut die KI bei der nächsten Verlängerung 1–2 Hill-Sessions ein (3–6 % Steigung am Laufband, simuliert Bergsprints/Hill Repeats).</div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Warm-up (m)</label>
        <input type="text" inputmode="decimal" pattern="[0-9]*" class="form-input" id="pe-warmup" value="${p.warmupM ?? 400}">
        <div class="pe-help">Einlaufen vor harten Einheiten bei Easy-Pace. 800 m Standard.</div>
      </div>
      <div class="form-group">
        <label class="form-label">Cool-down (m)</label>
        <input type="text" inputmode="decimal" pattern="[0-9]*" class="form-input" id="pe-cooldown" value="${p.cooldownM ?? 400}">
        <div class="pe-help">Auslaufen nach harten Einheiten. 600 m Standard.</div>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Verletzungen / Beschwerden</label>
      <textarea class="form-textarea" id="pe-restrictions" style="height:60px">${p.restrictions||''}</textarea>
      <div class="pe-help">Freitext für die KI bei Verlängerungen. Beispiele: „linkes Knie reizbar — keine Sprints, längere Pausen"; „Achillessehne empfindlich — nur weiche Pace-Übergänge". Bleibt leer wenn nichts.</div>
    </div>
    <div class="form-group">
      <label class="form-label" style="color:var(--faint)">Trainingstage / Wochenanzahl</label>
      <div style="font-size:11px;color:var(--muted);background:var(--surface2);padding:8px 10px;border-radius:8px">
        ${(p.weekdays||['Mo','Mi','Fr','Sa']).join(' · ')} · ${p.weeks?.length||0} Wochen · Langer Lauf: ${p.longRunDay||'Sa'}<br>
        <span style="color:var(--faint);font-size:10px">Diese Plan-Struktur lässt sich nicht ohne neuen Plan ändern.</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="generate-btn" style="background:var(--surface2);color:var(--text);border:1px solid var(--border2)" onclick="closePlanEdit()">Abbrechen</button>
      <button class="generate-btn" onclick="savePlanEdit()">Speichern</button>
    </div>`;
  document.getElementById('planedit-bg').classList.add('open');
}

function closePlanEdit() {
  document.getElementById('planedit-bg').classList.remove('open');
}

function savePlanEdit() {
  const id = document.getElementById('pe-id').value;
  const p = state.plans.find(x => x.id === id);
  if (!p) return;
  const oldBase = p.basePace || 8.0;
  const newBase = numFromInput('pe-basepace') || 8.0;

  p.name         = document.getElementById('pe-name').value.trim() || p.name;
  p.environment  = document.getElementById('pe-env').value;
  p.restrictions = document.getElementById('pe-restrictions').value;
  p.raceDate     = document.getElementById('pe-racedate').value || null;
  p.incline      = numFromInput('pe-incline');
  if (isNaN(p.incline)) p.incline = 1;
  const spVal    = numFromInput('pe-sprintpace');
  p.sprintPace   = (spVal > 0 ? spVal : null);
  p.hillTraining = document.getElementById('pe-hill').checked;
  p.warmupM    = Math.max(200, Math.min(2000, numFromInput("pe-warmup") || 400));
  p.cooldownM  = Math.max(200, Math.min(2000, numFromInput("pe-cooldown") || 400));
  const peTpMin = numFromInput('pe-targetpace-min');
  const peTpSec = numFromInput('pe-targetpace-sec');
  p.targetPaceSecPerKm = (peTpMin > 0) ? (peTpMin * 60 + (peTpSec || 0)) : null;
  p.experience   = document.getElementById('pe-experience').value;
  p.longestRun   = numFromInput('pe-longestrun') || 0;
  const peBtMin  = numFromInput('pe-besttime-min');
  const peBtSec  = numFromInput('pe-besttime-sec');
  p.bestTime5kSec = (peBtMin > 0) ? (peBtMin * 60 + (peBtSec || 0)) : null;

  // Wettkampftermin → Startdatum nachjustieren (so dass Plan am Termin endet)
  let startDate = document.getElementById('pe-startdate').value;
  if (p.raceDate && p.weeks?.length) {
    const rd = new Date(p.raceDate + 'T00:00:00');
    const sc = new Date(rd);
    sc.setDate(sc.getDate() - (p.weeks.length * 7 - 1));
    const y = sc.getFullYear(), m = String(sc.getMonth()+1).padStart(2,'0'), dd = String(sc.getDate()).padStart(2,'0');
    startDate = snapToMonday(`${y}-${m}-${dd}`);
  } else if (startDate) {
    startDate = snapToMonday(startDate);
  }
  p.startDate = startDate || p.startDate;

  // basePace-Änderung wirkt über paceFactor (alter pf bleibt erhalten)
  if (Math.abs(newBase - oldBase) > 0.01) {
    const oldFactor = paceFactor(p);
    p.basePace = newBase;
    p.paceFactor = oldFactor * (newBase / oldBase);
  }

  save();
  closePlanEdit();
  renderPlans();
  if (id === state.activePlanId) renderTracker();
}

function deletePlan(id) {
  if (!confirm('Plan wirklich löschen?')) return;
  state.plans = state.plans.filter(p => p.id !== id);
  // Clear done/feedback entries for this plan
  Object.keys(state.done).forEach(k => { if(k.startsWith(id+'-')) delete state.done[k]; });
  if (state.donePace) Object.keys(state.donePace).forEach(k => { if(k.startsWith(id+'-')) delete state.donePace[k]; });
  if (state.feedback) Object.keys(state.feedback).forEach(k => { if(k.startsWith(id+'-')) delete state.feedback[k]; });
  if (state.coachDismiss) Object.keys(state.coachDismiss).forEach(k => { if(k.startsWith(id+'-')) delete state.coachDismiss[k]; });
  if (state.activePlanId === id) state.activePlanId = state.plans.length ? state.plans[0].id : null;
  save();
  renderPlans();
}

// ─── Create ───────────────────────────────────────────────────────────────
// ─── ZENTRALE COACH-METHODIK ───────────────────────────────────────────────
// Diese Konstante ist die EINZIGE Quelle der Wahrheit für Lauf-Methodik.
// Sowohl der Plan-Generator als auch der Plan-Reviewer nutzen sie.
const COACH_PERSONA_INTRO = `Du bist ein erfahrener Lauftrainer mit Schwerpunkt evidenzbasierter Trainingssteuerung. Du arbeitest strikt nach:
- Jack Daniels Running Formula (VDOT-Pace-Zonen E/M/T/I/R)
- Stephen Seiler Polarisiertes Training (80/20-Verteilung)
- Arthur Lydiard Pyramide (Aerobe Basis → Hill → Anaerobic → Tapering)
- ACSM 10%-Regel und Gabbett ACWR 0,8-1,3 für Verletzungsprävention

Du erstellst KEINE Pläne, die methodisch fragwürdig sind. Du beschönigst nicht.`;

const COACH_HARD_RULES = (zones, longRunDay, otherTrainDays, isBeginner, targetKm, maxLongRun, goal) => `
PFLICHT-TRAININGSPRINZIPIEN (BEI VERLETZUNG IST DER PLAN UNGÜLTIG):

1. **80/20-Polarisierung (Seiler) — STRIKT:** ≥80 % der Wochen-Distanz im Easy-Bereich (E-Pace = ${zones.easy} km/h), max 20 % im Threshold/I/R-Bereich.
   → Bei Goal "${goal}":
     • "comfort" (festigen): MAX 1 Quality-Session pro Woche. Wenn ZIELPACE gesetzt: diese 1 Session in Zielpace (Tempo-Reiz, KEIN Wettkampf). Sonst rein aerob.
     • "reach" (erstmals schaffen): MAX 1 Quality-Session pro Woche, Fokus aerobe Basis + Long-Run-Aufbau
     • "race" (Bestzeit): MAX 2 Quality-Sessions pro Woche, Race-Pace-Blöcke ok ab Hälfte des Plans
   → "Quality-Session" = Tempo, Intervall, Race-Pace-Block, Hill Repeats. Easy + Strides zählen NICHT als Quality.
   → Wenn ein Long Run >50 % der Zieldistanz vorkommt, in DIESER Woche maximal 1 Quality-Session.

2. **Long Run KOMPLETT bei Easy-Pace (E-Pace ${zones.easy} km/h) — kein M-Pace, kein Tempo-Drift, kein Stufentempo:**
   → ALLE drei Phasen (p1, p2, p3) bei ${zones.p1} km/h GLEICHMÄSSIG (= EXAKT Easy-Pace, NICHT schneller).
   → Long Run NIE über ${maxLongRun} km (= 1,2× Zieldistanz)
   → Long Run max 30 % des Wochenvolumens
   → Long Run dient ausschließlich der aeroben Basis, NIE als Tempo-Test oder Quality-Reiz

3. **10 %-Regel (ACSM):** Wochen-Volumen steigt max +10 %/Woche, max +15 % nach Erholungswoche.

4. **Mesozyklus 3:1:** Jede 4. Woche = Erholungswoche mit −20 bis −30 % Volumen.

5. **Tapering** (in der Schlusswoche bei 6+ Wochen-Plänen):
   → Volumen −40 % vs. vorletzte Woche
   → KEIN hartes Intervall in der Tapering-Woche
   → Mi nur 2-3 km Easy mit 4 Strides (KEIN Tempo-Reiz 2-3 Tage vor Zieltest!)
   → Fr Pause oder 2 km ganz locker
   → Sa Zieltest gleichmäßig im Zieldistanz-Tempo

6. **Sprint-Regel:**
   ${isBeginner ? `→ KEINE 200m-Sprints für Anfänger! Stattdessen 4-6 × 30 Sek Strides @${zones.strides} km/h nach Easy.` : `→ 200m-Sprints @${zones.sprint} km/h ok ab Woche 3, vorher Strides 30 Sek @${zones.strides} km/h.`}

7. **Keine 2 harte Einheiten in Folge.** Zwischen Intervall- und Tempo-Tag immer min. 1 Easy- oder Ruhetag.

8. **Tempo-Pace muss echter Schwellenreiz sein:** ${zones.tempo} km/h für 20-40 Min — NICHT marathon-easy maskiert als Tempo. Wenn Tempo-Pace <1 km/h schneller als Easy ist, fehlt der Trainingsreiz.

9. **Easy-Pace muss WIRKLICH Easy sein:** ${zones.easy} km/h. KEIN „bequemes 30-Min-Tempo" das in Wahrheit Tempo ist.

VOR PLAN-AUSGABE: Selbst-Check (jeder Punkt wird sonst vom Reviewer abgestraft)
- Bei Goal "comfort"/"reach": mehr als 1 Quality-Session/Woche → ÜBERARBEITEN
- Bei Goal "race": mehr als 2 Quality-Sessions/Woche → ÜBERARBEITEN
- Long Run > ${maxLongRun} km → ÜBERARBEITEN
- Long Run mit p1.s ≠ ${zones.p1} oder p2.s ≠ ${zones.p1} oder p3.s ≠ ${zones.p1} → ÜBERARBEITEN (alle drei Phasen MÜSSEN ${zones.p1} sein)
- Long Run schneller als Easy-Pace ${zones.easy} → ÜBERARBEITEN
- Hat eine "Erholungswoche" nicht ≥20 % Volumenreduktion → ÜBERARBEITEN
- Hat letzte Woche (Tapering) Tempo-Reiz oder Intervall in Mi/Fr → ÜBERARBEITEN
- Race-Pace-Blöcke bei Goal "comfort"/"reach" → ÜBERARBEITEN, durch Easy-Volumen ersetzen
- Easy-Anteil unter 80 % der Wochen-km → ÜBERARBEITEN
- Tempo/Intervall/Sprint-Session OHNE Warm-up als erste Pace-Zeile → ÜBERARBEITEN
- Tempo/Intervall/Sprint-Session OHNE Cool-down als letzte Pace-Zeile → ÜBERARBEITEN
- Strides-Tag OHNE Cool-down nach den Strides → ÜBERARBEITEN`;

function buildPlanPrompt(o) {
  const hasTargetPace = !!o.targetPaceSecPerKm;
  // Kurz fürs JSON (User-sichtbar). Lange Erklärung kommt separat in den Constraints.
  const goalMap = {
    reach:   'erstmals schaffen',
    comfort: hasTargetPace ? 'in Zielpace festigen' : 'locker festigen',
    race:    'in Bestzeit laufen'
  };
  const expMap = {
    beginner:    'Anfänger (unter 1 Jahr regelmäßiges Lauftraining) — vorsichtige Volumen-Steigerung, mehr Easy, KEINE 200m-Sprints, höchstens Strides',
    recreational:'Hobbyläufer (1–3 Jahre) — moderate Belastung, Strides ok, Sprints sparsam',
    experienced: 'erfahrener Läufer (3+ Jahre, kennt Trainingspläne) — volle Belastungspalette inkl. Intervall + Sprints',
    competitive: 'Wettkampfläufer (regelmäßige Periodisierung) — komplexe Einheiten ok, hohe Intensität tolerierbar'
  };
  const envMap = {
    indoor: 'INDOOR / Laufband — Kinomap-Strecken pro langer Lauf rotieren (Tokyo Imperial Palace, Paris Seine, Central Park NYC, Chicago Lakefront, London Hyde Park, Barcelona Barceloneta, Amsterdam Canals, Singapore Marina Bay).',
    outdoor: 'OUTDOOR — KEINE Kinomap-Felder. Stattdessen Hinweis im title oder kurze Tip-Texte zu Streckentyp (flach/wellig). kinomap immer null.',
    mix: 'MIX (Indoor + Outdoor) — Kinomap nur beim langen Lauf, alle anderen Tage outdoor-tauglich.'
  };
  const wkOrder = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  const trainings = (o.weekdays || ['Mo','Mi','Fr','Sa']).slice().sort((a,b)=>wkOrder.indexOf(a)-wkOrder.indexOf(b));
  const longDay = o.longRunDay || trainings[trainings.length-1];
  const restDays = wkOrder.filter(d => !trainings.includes(d));
  const otherTrainDays = trainings.filter(d => d !== longDay);
  const bp = parseFloat(o.basePace) || 8.0;
  const sprintExplicit = (o.sprintPace && o.sprintPace > 0) ? parseFloat(o.sprintPace) : null;
  const isBeginner = o.experience === 'beginner';

  // Daniels-konforme Pace-Zonen — abgeleitet aus Easy + Erfahrung
  // Long Run KOMPLETT bei E-Pace (Coach-Korrektur — kein M-Pace, kein Tempo-Drift)
  const z = {
    easy:    bp.toFixed(1),
    p1:      bp.toFixed(1),               // Long-Run = E-Pace, keine Steigerung
    p2:      bp.toFixed(1),               // Long-Run = E-Pace, keine Steigerung
    p3:      bp.toFixed(1),               // Long-Run = E-Pace, keine Steigerung
    tempo:   (bp + 1.4).toFixed(1),       // T-Pace nach Daniels (~88% VO2max)
    intervall:(bp + 2.2).toFixed(1),      // I-Pace nach Daniels (~98% VO2max, 3-5min haltbar)
    sprint:  (sprintExplicit != null ? sprintExplicit : (bp + 3.0)).toFixed(1),  // R-Pace
    strides: (bp + 2.0).toFixed(1),       // Strides für Anfänger — neuromuskulär ohne Sprint-Belastung
    trab:    Math.max(5.0, bp - 1.5).toFixed(1)
  };

  // Bestzeit-Hinweis (Daniels VDOT-Anker)
  let vdotHint = '';
  if (o.bestTime5kSec) {
    const minPerKm = (o.bestTime5kSec / 5) / 60;
    const m = Math.floor(minPerKm); const s = Math.round((minPerKm - m) * 60);
    vdotHint = `\n- 5 km BESTZEIT des Läufers: ${Math.floor(o.bestTime5kSec/60)}:${String(o.bestTime5kSec%60).padStart(2,'0')} (= ${m}:${String(s).padStart(2,'0')}/km im Wettkampf). Verwende diese Zeit als VDOT-Anker und justiere die T/I/R-Pace-Werte oben falls nötig nach Daniels-Tabelle (T = ~10s/km langsamer als 5k-Pace, I = 5k-Pace, R = ~8s/km schneller als 5k-Pace).`;
  }

  const longestRun = o.longestRun || 5;
  const targetKm = parseFloat(o.distance) || 10;
  // Long Run darf NIE über 1,2× Zieldistanz hinausgehen (Daniels-Standard)
  const maxLongRun = Math.round(targetKm * 1.2 * 2) / 2;
  // Start: 70% vom längsten Lauf bisher, aber nie höher als Zieldistanz
  const startLongRun = Math.min(targetKm, Math.max(2.0, Math.round((longestRun * 0.7) * 2) / 2));

  // Sanity-Check: Easy vs. 5k-Bestzeit (Daniels-VDOT-Korridor)
  let inconsistencyHint = '';
  if (o.bestTime5kSec) {
    const fivekKmh = 5 / (o.bestTime5kSec / 3600);
    const expectedEasy = fivekKmh - 2.0;     // grob: Easy ~ 5k-Pace - 2 km/h
    if (Math.abs(bp - expectedEasy) > 1.0) {
      inconsistencyHint = `\n\n⚠ WICHTIG — DATEN-INKONSISTENZ ERKANNT: User-Easy ${bp} km/h passt NICHT zur 5k-Bestzeit (${fivekKmh.toFixed(1)} km/h Wettkampftempo). Daniels-konformes Easy wäre ${expectedEasy.toFixed(1)} km/h. NIMM ${expectedEasy.toFixed(1)} km/h als Easy-Anker (nicht ${bp}) und justiere alle Pace-Zonen entsprechend nach unten. Der User hat das Easy-Konzept vermutlich missverstanden — er gibt Tempo statt echtes Easy an.`;
    }
  }

  const incl = o.incline ?? 1;
  const inclLine = `\n- LAUFBAND-STEIGUNG: ${incl}% (Standard für die Pace-Werte). NICHT in title oder paces erwähnen — wird automatisch angezeigt.`;
  const hillLine = (o.hillTraining && !isBeginner) ? `\n- HILL-TRAINING aktiv: 1–2 Hill-Sessions pro Block einbauen. Notation: " ↗ X%" am Ende der Pace-Zeile (z.B. "6× 200m @ ${z.sprint} ↗ 5%"). Hill Sprints 4-6%, Hill Repeats 3-5%, Hill Tempo 2-3%.` : '';

  let raceLine = '';
  if (o.raceDate) {
    raceLine = `\n- WETTKAMPFTERMIN: ${o.raceDate}. Letzte Woche = TAPERING (Volumen −40 %, KEIN hartes Intervall, nur kurze Lockerläufe + 1 lockerer Tempo-Reiz, am Wettkampftag-Vortag nur 2-3 km Easy mit 4 Strides).`;
  }
  const restrictLine = o.restrictions ? `\n- VERLETZUNGEN/BESCHWERDEN: ${o.restrictions} → entsprechend modifizieren (weniger/keine Sprints, längere Pausen, mehr Easy)` : '';
  let targetPaceLine = '';
  if (o.targetPaceSecPerKm) {
    const tpMin = Math.floor(o.targetPaceSecPerKm / 60);
    const tpSec = o.targetPaceSecPerKm % 60;
    const targetKmh = (3600 / o.targetPaceSecPerKm).toFixed(1);
    if (o.goal === 'race') {
      targetPaceLine = `\n- ZIELPACE AM PLAN-ENDE: ${tpMin}:${String(tpSec).padStart(2,'0')}/km (= ${targetKmh} km/h). Schluss-Zieltest in der letzten Woche EXAKT in dieser Pace. Plan baut darauf hin: 2-3 Race-Pace-Reize in den letzten 3 Wochen, im Tapering 1× kurzer Race-Pace-Reiz.`;
    } else if (o.goal === 'comfort') {
      // Comfort + Zielpace: routiniert auf Zielpace, ohne Wettkampf-Spitzen
      targetPaceLine = `\n- ZIELPACE (routiniert erreichen, KEIN Wettkampf): ${tpMin}:${String(tpSec).padStart(2,'0')}/km (= ${targetKmh} km/h). Plan trainiert sanft auf diese Pace hin: 1 Tempo-Session pro Woche in Zielpace (z.B. 2-3 km gleichmäßig oder 2× 1500m mit kurzer Pause). Schluss-Lauf der letzten Woche EXAKT in Zielpace gleichmäßig (= ${targetKmh} km/h, NICHT Easy). KEIN aggressives Tapering — letzte Woche Volumen nur leicht reduzieren (-25%), kein Race-Pace-Reiz vor Schluss-Lauf.`;
    } else {
      // reach: nur Information, Long-Run-Aufbau-fokus
      targetPaceLine = `\n- LANGFRISTIGES ZIELTEMPO: ${tpMin}:${String(tpSec).padStart(2,'0')}/km (= ${targetKmh} km/h) — als Orientierung. Plan baut primär aerobe Basis auf (Long-Run-Aufbau), Schluss-Lauf gleichmäßig in Easy-Pace, NICHT in Zielpace.`;
    }
  }

  // Anfänger-spezifische Anpassung der Sprint-Logik
  const sprintRule = isBeginner
    ? `Für Anfänger KEINE 200m-Sprints @${z.sprint}! Stattdessen 4–6 × 30 Sek Strides @${z.strides} nach einem Easy-Lauf.`
    : `200m-Sprints @${z.sprint} ok ab Woche 3, vorher Strides 30 Sek @${z.strides}.`;

  // Tapering-Regel
  const taperWeek = parseInt(o.weeks) >= 6 ? `Letzte Woche = ECHTES TAPER: Volumen −40 %, KEIN hartes Intervall, nur 1 lockerer Tempo-Reiz Mi (max 2 km), Long-Run am Sa = Zieltest in gleichmäßigem ${z.p2} km/h.` : '';

  const wuM = o.warmupM ?? 400;
  const cdM = o.cooldownM ?? 400;

  return `${COACH_PERSONA_INTRO}

Du erstellst JETZT einen ${o.weeks}-Wochen-Trainingsplan als JSON. Nicht beschönigen, nicht überfordern — wissenschaftlich sauber.

LÄUFER-PROFIL:
- Erfahrung: ${expMap[o.experience] || expMap.recreational}
- Zieldistanz: ${o.distance} km
- Ziel: ${goalMap[o.goal] || goalMap.reach}
- Easy-Tempo (E-Pace, vom User angegeben): ${bp.toFixed(1)} km/h${vdotHint}${inconsistencyHint}
- Längster Lauf bisher: ${longestRun} km → Long-Run-Start in Woche 1: max. ${startLongRun} km
- Trainingstage: ${trainings.join(', ')}
- Langer Lauf an: ${longDay}
- Ruhetage (müssen als type:"rest" im JSON stehen): ${restDays.join(', ') || '(keine)'}
- Umgebung: ${envMap[o.environment] || envMap.mix}${inclLine}${hillLine}${raceLine}${targetPaceLine}${restrictLine}
- Warm-up VOR JEDER Session mit Tempo/Intervall/Sprint/Strides: ${wuM}m bei Easy-Pace (PFLICHT — erste Pace-Zeile)
- Cool-down NACH JEDER Session mit Tempo/Intervall/Sprint/Strides: ${cdM}m bei Easy-Pace (PFLICHT — letzte Pace-Zeile)
- Reine Easy-Tage (nur "X km locker") brauchen KEIN WU/CD — Easy IST das Aufwärmen
- Bei Strides nach Easy: Easy-Lauf zählt als WU, danach Strides direkt, dann ${cdM}m Cool-down ergänzen
- Sonstige Wünsche: ${o.notes || 'keine'}

PACE-ZONEN (km/h) — DAS IST DIE EINZIGE QUELLE FÜR PACE-WERTE IM PLAN:
- Easy/E-Pace: ${z.easy} km/h
- Long-Run p1/p2/p3 ALLE GLEICH: ${z.p1} km/h (kein Stufentempo!)
- Tempo/T-Pace: ${z.tempo} km/h (~88% VO2max, 20-40 Min haltbar)

WOCHENVOLUMEN-GRENZEN:
- Wochenvolumen NIEMALS über 4× Zieldistanz
- Faustregel ${(targetKm*2.5).toFixed(0)}-${(targetKm*3.5).toFixed(0)} km/Woche als realistisches Volumen

LONG-RUN-AUFBAU:

- Zieldistanz in vorletzter Woche, Schlusswoche je nach Ziel

${COACH_HARD_RULES(z, longDay, otherTrainDays, isBeginner, targetKm, maxLongRun, o.goal || 'reach')}

Antworte NUR mit validem JSON, kein Text davor oder danach, keine Markdown-Backticks. Wenn dein Plan einen der Pflicht-Constraints verletzt, ÜBERARBEITE ihn vor Ausgabe.

JSON-Format (alle Wochentage Mo–So pro Woche, type:"rest" für Nicht-Trainingstage):
{
  "name": "${o.weeks}-Wochen ${o.distance} km Plan",
  "goal": "${o.distance} km ${goalMap[o.goal] || 'erreichen'}",

        { "tag":"${restDays[0]||'So'}", "type":"rest", "title":"Ruhetag", "paces":null, "kinomap":null, "lang":null }
      ]

}

function readCreateForm() {
  const wkOrder = ['Mo','Di','Mi','Do','Fr','Sa','So'];
  let weekdays = Array.from(document.querySelectorAll('.f-wd:checked')).map(c => c.value);
  if (!weekdays.length) weekdays = ['Mo','Mi','Fr','Sa'];
  weekdays.sort((a,b) => wkOrder.indexOf(a) - wkOrder.indexOf(b));
  let longRunDay = document.querySelector('input[name=f-longrun]:checked')?.value || 'Sa';
  if (!weekdays.includes(longRunDay)) longRunDay = weekdays[weekdays.length - 1]; // letzter Trainingstag
  let startDate = snapToMonday(document.getElementById('f-startdate').value || todayISO());
  const weeks = Math.max(4, Math.min(16, parseInt(document.getElementById('f-weeks').value) || 8));
  const raceDate = document.getElementById('f-racedate').value || null;
  // Wenn Wettkampftermin gesetzt: rückwärts rechnen — Plan endet exakt am Wettkampftag (oder am Sonntag der Plan-Woche)
  if (raceDate) {
    const rd = new Date(raceDate + 'T00:00:00');
    const startCalc = new Date(rd);
    startCalc.setDate(startCalc.getDate() - (weeks * 7 - 1));
    const y = startCalc.getFullYear(), m = String(startCalc.getMonth()+1).padStart(2,'0'), dd = String(startCalc.getDate()).padStart(2,'0');
    startDate = snapToMonday(`${y}-${m}-${dd}`);
  }
  // Bestzeit
  const btMin = numFromInput('f-besttime-min');
  const btSec = numFromInput('f-besttime-sec');
  const bestTime5kSec = (btMin > 0) ? (btMin * 60 + (btSec || 0)) : null;
  // Zielpace
  const tpMin = numFromInput('f-targetpace-min');
  const tpSec = numFromInput('f-targetpace-sec');
  const targetPaceSecPerKm = (tpMin > 0) ? (tpMin * 60 + (tpSec || 0)) : null;

  return {
    distance: document.getElementById('f-distance').value,
    weeks,
    weekdays: weekdays.length ? weekdays : ['Mo','Mi','Fr','Sa'],
    longRunDay,
    basePace: numFromInput('f-basepace') || 8.0,
    experience: document.getElementById('f-experience').value,
    longestRun: numFromInput('f-longestrun') || 0,
    bestTime5kSec,
    goal: document.getElementById('f-goal').value,
    notes: document.getElementById('f-notes').value,
    startDate,
    raceDate,
    environment: document.getElementById('f-env').value,
    restrictions: document.getElementById('f-restrictions').value,
    incline: numFromInput('f-incline') || 0,
    sprintPace: numFromInput('f-sprintpace') || null,
    hillTraining: document.getElementById('f-hill').checked,
    warmupM: Math.max(200, Math.min(2000, numFromInput("f-warmup") || 400)),
    cooldownM: Math.max(200, Math.min(2000, numFromInput("f-cooldown") || 400)),
    targetPaceSecPerKm,
    apiKey: (document.getElementById('f-apikey')?.value || '').trim()
  };
}

async function copyPromptForClaude() {
  const o = readCreateForm();
  const prompt = buildPlanPrompt(o);
  try { await navigator.clipboard.writeText(prompt); }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = prompt; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  }
  document.getElementById('claude-flow').style.display = 'block';
  document.getElementById('claude-flow').scrollIntoView({behavior:'smooth', block:'start'});
  const btn = document.getElementById('btn-copy-prompt');
  if (btn) { const old = btn.textContent; btn.textContent = '✓ Prompt kopiert'; setTimeout(()=>{btn.textContent=old;}, 2000); }
}

function importPlanFromJson() {
  const raw = document.getElementById('f-jsonpaste').value.trim();
  if (!raw) { showError('Bitte zuerst die JSON-Antwort von Claude einfügen.'); return; }
  try {
    const clean = raw.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    const planData = JSON.parse(clean);
    if (!planData.weeks || !Array.isArray(planData.weeks) || !planData.weeks.length) {
      throw new Error('Kein gültiges weeks-Array gefunden.');
    }
    const o = readCreateForm();
    const newPlan = {
      ...planData,
      id: 'plan-' + Date.now(),
      startDate: o.startDate,
      distance: parseFloat(o.distance) || null,
      basePace: o.basePace,
      experience: o.experience,
      longestRun: o.longestRun,
      bestTime5kSec: o.bestTime5kSec,
      weekdays: o.weekdays,
      longRunDay: o.longRunDay,
      raceDate: o.raceDate,
      environment: o.environment,
      restrictions: o.restrictions,
      incline: o.incline,
      sprintPace: o.sprintPace,
      hillTraining: o.hillTraining,
      warmupM: o.warmupM,
      cooldownM: o.cooldownM,
      targetPaceSecPerKm: o.targetPaceSecPerKm,
    };
    state.plans.push(newPlan);
    state.activePlanId = newPlan.id;
    state.currentWeek[newPlan.id] = 0;
    save();
    // Automatischer Coach-Review im Hintergrund (silent, wenn API-Key vorhanden)
    if (state.apiKey) { setTimeout(() => reviewPlanWithCoach(newPlan, null, { silent: true }).then(() => { renderTracker(); }).catch(e => console.warn("Auto-Review fehlgeschlagen:", e)), 1500); }
    document.getElementById('create-content').innerHTML = `
      <div class="generating-state">
        <div style="display:flex;justify-content:center;color:var(--green);margin-bottom:16px">${icon('check',56,{strokeWidth:2.5})}</div>
        <div class="generating-text" style="color:var(--green);font-size:18px;font-weight:600">${newPlan.name} importiert!</div>
        <div class="generating-sub" style="margin-bottom:24px">${newPlan.weeks.length} Wochen · automatisch aktiviert</div>
        <button style="padding:12px 28px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer" onclick="showScreen('tracker')">Zum Plan</button>
      </div>`;
  } catch(e) {
    showError('JSON konnte nicht gelesen werden: ' + e.message);
  }
}

    const text = data.content.find(b => b.type === 'text')?.text || '';
    const clean = text.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
    const planData = JSON.parse(clean);

    const newPlan = {
      ...planData,
      id: 'plan-' + Date.now(),
      startDate: o.startDate,
      distance: parseFloat(o.distance) || null,
      basePace: o.basePace,
      experience: o.experience,
      longestRun: o.longestRun,
      bestTime5kSec: o.bestTime5kSec,
      weekdays: o.weekdays,
      longRunDay: o.longRunDay,
      raceDate: o.raceDate,
      environment: o.environment,
      restrictions: o.restrictions,
      incline: o.incline,
      sprintPace: o.sprintPace,
      hillTraining: o.hillTraining,
      warmupM: o.warmupM,
      cooldownM: o.cooldownM,
      targetPaceSecPerKm: o.targetPaceSecPerKm,
    };

    state.plans.push(newPlan);
    state.activePlanId = newPlan.id;
    state.currentWeek[newPlan.id] = 0;
    save();
    // Automatischer Coach-Review im Hintergrund (silent, wenn API-Key vorhanden)
    if (state.apiKey) { setTimeout(() => reviewPlanWithCoach(newPlan, null, { silent: true }).then(() => { renderTracker(); }).catch(e => console.warn("Auto-Review fehlgeschlagen:", e)), 1500); }

    document.getElementById('create-content').innerHTML = `
      <div class="generating-state">
        <div style="display:flex;justify-content:center;color:var(--green);margin-bottom:16px">${icon('check',56,{strokeWidth:2.5})}</div>
        <div class="generating-text" style="color:var(--green);font-size:18px;font-weight:600">${newPlan.name} erstellt!</div>
        <div class="generating-sub" style="margin-bottom:24px">${newPlan.weeks.length} Wochen · automatisch aktiviert</div>
        <button style="padding:12px 28px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer" onclick="showScreen('tracker')">Zum Plan</button>
      </div>`;

  } catch(e) {
    renderCreate();
    showError('Fehler: ' + e.message + '\n\nBitte API Key prüfen.');
  }
}

function showError(msg) {
  const el = document.getElementById('create-error');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function toggleKeyVisibility() {
  const inp = document.getElementById('f-apikey');
  if (!inp) return;
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// Plan-Export: alle Pläne + Done-Status als JSON in Zwischenablage
async function exportPlanData() {
  const exportObj = {
    exportedAt: todayISO(),
    appVersion: APP_VERSION,
    plans: state.plans,
    activePlanId: state.activePlanId,
    currentWeek: state.currentWeek,
    done: state.done,
    donePace: state.donePace,
    feedback: state.feedback,
    coachDismiss: state.coachDismiss
  };
  const json = JSON.stringify(exportObj);
  try {
    await navigator.clipboard.writeText(json);
    alert(`Daten in Zwischenablage kopiert (${state.plans.length} Plan${state.plans.length!==1?'e':''}).\n\nAuf anderem Gerät:\n1. App öffnen\n2. Hilfe-Sheet öffnen\n3. „Plan-Daten importieren" tippen\n4. JSON aus Zwischenablage einfügen`);
  } catch(e) {
    prompt('JSON manuell kopieren:', json);
  }
}

function openImportDialog() {
  const json = prompt('JSON-Daten vom anderen Gerät hier einfügen:');
  if (!json) return;
  try {
    const data = JSON.parse(json);
    if (!data.plans || !Array.isArray(data.plans)) throw new Error('Ungültige Daten — kein Plans-Array');
    const planCount = data.plans.length;
    if (!confirm(`Import enthält ${planCount} Plan${planCount!==1?'e':''}. Deine aktuellen lokalen Pläne werden ÜBERSCHRIEBEN. Fortfahren?`)) return;
    const oldKey = state.apiKey;
    const oldTheme = state.theme;
    state.plans = data.plans;
    state.activePlanId = data.activePlanId;
    state.currentWeek = data.currentWeek || {};
    state.done = data.done || {};
    state.donePace = data.donePace || {};
    state.feedback = data.feedback || {};
    state.coachDismiss = data.coachDismiss || {};
    state.apiKey = oldKey;
    state.theme = oldTheme;
    save();
    alert(`${planCount} Plan${planCount!==1?'e':''} importiert. App lädt neu.`);
    location.reload();
  } catch(e) {
    alert('Import fehlgeschlagen: ' + e.message);
  }
}

async function copyKeyToClipboard() {
  const key = state.apiKey;
  if (!key) return;
  try {
    await navigator.clipboard.writeText(key);
    alert('API-Key in Zwischenablage kopiert.\n\nJetzt per AirDrop / Notizen / Mail aufs iPhone bringen, dort in der App im Erstellen-Tab einfügen.');
  } catch(e) {
    prompt('Key (manuell kopieren):', key);
  }
}

// ─── Service Worker (Offline) ─────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────
load();
ensurePlanDefaults();
applyTheme(state.theme || 'dunkel');
// Tab-Icons
document.getElementById('tab-icon-tracker').innerHTML = icon('activity', 22);
document.getElementById('tab-icon-plans').innerHTML   = icon('list', 22);
document.getElementById('tab-icon-create').innerHTML  = icon('sparkles', 22);
// Letzten Screen wiederherstellen
showScreen(state.lastScreen || 'tracker');

// Build-Version-Indikator (klein, oben links — damit du sofort siehst welche Version läuft)
const verBadge = document.createElement('div');
verBadge.style.cssText = 'position:fixed;bottom:calc(var(--tab-h) + 4px);right:6px;z-index:90;font-family:DM Mono,monospace;font-size:8px;font-weight:600;color:var(--faint);background:transparent;padding:2px 5px;border-radius:3px;letter-spacing:0.04em;pointer-events:none;opacity:0.5';
verBadge.textContent = 'v ' + APP_VERSION;
document.body.appendChild(verBadge);
</script>
